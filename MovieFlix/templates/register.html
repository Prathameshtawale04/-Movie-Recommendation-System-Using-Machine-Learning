{% extends "base.html" %}

{% block title %}Create Account - MovieFlix{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-cinematic-backdrop"></div>
  <div class="auth-glass-panel">
    <div class="auth-header-block">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-desc">Join MovieFlix to experience AI-powered movie discovery.</p>
    </div>
    
    <form action="{{ url_for('register') }}" method="POST" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          class="form-control"
          placeholder="e.g., Alex Mercer"
          value="{{ name if name is defined else '' }}"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="alex@college.edu"
          value="{{ email if email is defined else '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="At least 6 characters"
          required
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          class="form-control"
          placeholder="Re-enter your password"
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-submit-btn">
        Create Your Free Account
      </button>
    </form>

    <div class="auth-footer-block">
      <p class="auth-switch-text">
        Already have a MovieFlix account? 
        <a href="{{ url_for('login') }}" class="auth-accent-link">Sign in here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
